<style>
  :root{
    --ink:#111411;
    --paper:#fffefa;
    --mint:#cfe7d7;
    --mint-deep:#acd3bc;
    --green:#278d4b;
    --green-dark:#176536;
    --amber:#f2a72b;
    --red:#c9363d;
    --muted:#4b594f;
    --line:#172019;
    --shadow:4px 5px 0 rgba(17,20,17,.82);
    --shadow-soft:5px 7px 16px rgba(17,20,17,.14);
  }
  *{box-sizing:border-box;}
  html{background:var(--mint);scroll-behavior:smooth;}
  body{
    margin:0;font-size:17px;
    min-width:320px;
    background:var(--mint);
    color:var(--ink);
    font-family:"Trebuchet MS","Noto Sans TC",sans-serif;
    line-height:1.45;
    overflow-x:hidden;
  }
  body.detail-open{overflow:hidden;}
  button,input,a{font:inherit;}
  button,a{-webkit-tap-highlight-color:transparent;}
  ::selection{background:var(--amber);color:var(--ink);}
  :focus-visible{outline:3px solid var(--amber);outline-offset:3px;}
  *{scrollbar-width:thin;scrollbar-color:var(--ink) var(--mint-deep);}
  *::-webkit-scrollbar{width:11px;height:11px;}
  *::-webkit-scrollbar-track{background:var(--mint-deep);}
  *::-webkit-scrollbar-thumb{background:var(--ink);border:2px solid var(--mint-deep);}
  svg{display:block;}
  .app-shell{
    min-height:100vh;
    display:grid;
    grid-template-columns:224px minmax(440px,1fr) minmax(360px,480px);
    grid-template-rows:74px 1fr;
    background-color:var(--mint);
    background-image:linear-gradient(rgba(23,32,25,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(23,32,25,.055) 1px,transparent 1px);
    background-size:22px 22px;
  }
  .sidebar{
    grid-row:1 / -1;
    background:rgba(207,231,215,.96);
    border-right:2px solid var(--line);
    padding:22px 14px;
    position:sticky;
    top:0;
    height:100vh;
    z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:29px;}
  .brand-mark{
    width:34px;height:34px;background:var(--green);
    border:2px solid var(--line);box-shadow:3px 3px 0 var(--line);
    display:grid;place-items:center;flex:0 0 auto;
  }
  .brand-mark svg{width:19px;height:19px;stroke:white;stroke-width:2;fill:none;}
  .brand-name{font:900 20px/1 Georgia,"Noto Serif TC",serif;letter-spacing:-.02em;}
  .brand-note{font:700 16px/1.3 "Courier New",monospace;color:var(--muted);letter-spacing:.08em;margin-top:4px;}
  .rail-label{font:700 16px/1 "Courier New",monospace;color:var(--muted);letter-spacing:.1em;margin:0 5px 12px;}
  .rail-nav{display:grid;gap:10px;}
  .rail-item{
    width:100%;border:2px solid var(--line);background:var(--paper);color:var(--ink);
    box-shadow:3px 4px 0 var(--line);padding:10px 9px;display:flex;align-items:center;
    gap:8px;font-size:17px;font-weight:800;text-align:left;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
  }
  .rail-item:hover{transform:translate(-1px,-1px);box-shadow:5px 6px 0 var(--line);}
  .rail-item.active{background:var(--amber);}
  .rail-item svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;}
  .rail-count{margin-left:auto;background:var(--ink);color:white;padding:2px 6px;font:700 16px/1.4 "Courier New",monospace;}
  .rail-meta{position:absolute;left:18px;right:18px;bottom:20px;border-top:1px solid rgba(17,20,17,.35);padding-top:12px;font:700 16px/1.6 "Courier New",monospace;color:var(--muted);}
  .topbar{
    grid-column:2 / -1;
    min-width:0;
    display:flex;align-items:center;gap:18px;
    padding:12px 18px;border-bottom:2px solid var(--line);background:rgba(207,231,215,.95);
    position:sticky;top:0;z-index:15;
  }
  .title-block{min-width:210px;}
  h1{font:900 clamp(28px,2.5vw,38px)/1.05 Georgia,"Noto Serif TC",serif;letter-spacing:-.025em;margin:0;}
  .subtitle{margin:5px 0 0;font:700 16px/1.2 "Courier New",monospace;color:var(--muted);letter-spacing:.04em;}
  .search-wrap{margin-left:auto;width:min(390px,42vw);position:relative;}
  .search-wrap svg{position:absolute;width:17px;height:17px;left:11px;top:50%;transform:translateY(-50%);fill:none;stroke:currentColor;stroke-width:2;pointer-events:none;}
  #search{
    width:100%;border:2px solid var(--line);background:var(--paper);color:var(--ink);
    padding:9px 40px 9px 36px;box-shadow:3px 4px 0 rgba(17,20,17,.6);font-size:17px;border-radius:0;
  }
  #search::placeholder{color:#69726c;opacity:1;}
  .keycap{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:1px solid var(--line);padding:1px 4px;font:700 14px/1.4 "Courier New",monospace;background:#eef1ec;}
  .random-btn{
    flex:0 0 auto;border:2px solid var(--line);background:var(--ink);color:white;padding:10px 14px;
    box-shadow:3px 4px 0 var(--green);font-weight:900;font-size:16px;cursor:pointer;text-transform:uppercase;
  }
  .random-btn:hover{background:var(--green-dark);}
  .catalog{
    grid-column:2;min-width:0;border-right:2px solid var(--line);padding:12px 14px 48px;background:rgba(207,231,215,.82);
  }
  .filter-strip{position:sticky;top:74px;z-index:10;background:var(--mint);border-bottom:2px solid var(--line);padding:0 8px 10px;margin:0 -8px 13px;}
  .chips{display:flex;gap:7px;overflow:auto;padding:1px 3px 5px 1px;}
  .chip{
    appearance:none;border:1.5px solid var(--line);border-radius:0;background:var(--paper);color:var(--ink);
    padding:7px 10px;font:800 15px/1 "Trebuchet MS",sans-serif;white-space:nowrap;cursor:pointer;
  }
  .chip:hover{background:#e9efe9;}
  .chip.active{background:var(--ink);color:white;box-shadow:2px 3px 0 var(--amber);}
  .results-line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:7px 1px 0;font:700 16px/1.4 "Courier New",monospace;color:#48544c;text-transform:uppercase;letter-spacing:.03em;}
  .list{display:grid;gap:13px;}
  .repo-card{
    width:100%;border:2px solid var(--line);background:var(--paper);color:var(--ink);box-shadow:var(--shadow);
    padding:0;text-align:left;cursor:pointer;position:relative;overflow:visible;transition:transform .16s ease,box-shadow .16s ease;
  }
  .repo-card:hover{transform:translate(-2px,-2px);box-shadow:7px 8px 0 var(--line);}
  .repo-card.selected{background:#f8fff9;box-shadow:5px 6px 0 var(--green-dark);}
  .repo-card.selected::before{content:"";position:absolute;inset:-2px auto -2px -2px;width:7px;background:var(--green);border:2px solid var(--line);}
  .repo-id{position:absolute;top:-12px;left:-2px;background:var(--amber);border:1.5px solid var(--line);padding:2px 7px;font:800 16px/1.3 "Courier New",monospace;z-index:2;}
  .card-main{padding:14px 13px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 14px;align-items:start;}
  .repo-name{font:900 clamp(22px,2vw,27px)/1.05 Georgia,"Noto Serif TC",serif;letter-spacing:-.02em;overflow-wrap:anywhere;}
  .repo-kind{font:800 16px/1.4 "Courier New",monospace;text-transform:uppercase;color:var(--muted);text-align:right;}
  .repo-tagline{font-size:17px;font-weight:800;color:#334139;}
  .repo-url{font:700 16px/1.35 "Courier New",monospace;color:#48544c;overflow-wrap:anywhere;text-align:right;}
  .card-foot{border-top:1.5px solid var(--line);padding:8px 13px;display:flex;align-items:center;gap:8px;}
  .cat-tag,.org-tag{display:inline-flex;border:1.5px solid var(--line);padding:3px 7px;font:800 16px/1.3 "Courier New",monospace;text-transform:uppercase;}
  .cat-tag{background:var(--mint);}
  .org-tag{background:var(--amber);}
  .open-hint{margin-left:auto;font:900 15px/1 "Courier New",monospace;display:flex;align-items:center;gap:5px;}
  .open-hint svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;}
  .empty{border:2px dashed var(--line);background:rgba(255,254,250,.55);padding:64px 24px;text-align:center;}
  .empty strong{display:block;font:900 29px/1.2 Georgia,serif;margin-bottom:8px;}
  .empty span{font-size:17px;color:var(--muted);}
  .detail-pane{grid-column:3;min-width:0;padding:20px 18px 44px;background:rgba(207,231,215,.72);}
  .detail-sticky{position:sticky;top:94px;display:grid;gap:17px;}
  .detail-sheet{background:var(--paper);border:2px solid var(--line);box-shadow:var(--shadow-soft),4px 5px 0 var(--line);padding:20px;min-width:0;min-height:360px;overflow-wrap:anywhere;}
  .detail-head{display:flex;justify-content:space-between;gap:16px;padding-bottom:15px;border-bottom:2px solid var(--line);}
  .detail-name{font:900 clamp(30px,3.1vw,47px)/.98 Georgia,"Noto Serif TC",serif;letter-spacing:-.03em;overflow-wrap:anywhere;}
  .detail-number{font:800 16px/1.5 "Courier New",monospace;color:var(--muted);text-align:right;flex:0 0 auto;}
  .detail-meta{display:grid;grid-template-columns:1fr 1fr;gap:13px 18px;padding:16px 0;border-bottom:1.5px solid var(--line);}
  .meta-label{font:800 16px/1.2 "Courier New",monospace;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;}
  .meta-value{font-size:17px;font-weight:900;overflow-wrap:anywhere;}
  .detail-copy{padding:17px 0;}
  .detail-copy h2{font:900 16px/1 "Courier New",monospace;text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px;padding-bottom:7px;border-bottom:1.5px solid var(--line);}
  .detail-copy p{font-size:18px;line-height:1.7;margin:0;color:#29322c;}
  .detail-copy .english{font:700 15px/1.55 "Courier New",monospace;color:var(--muted);margin-top:10px;}
  .detail-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;margin-top:4px;}
  .action{
    border:2px solid var(--line);color:var(--ink);text-decoration:none;padding:12px 9px;font-size:16px;font-weight:900;
    min-width:0;display:flex;justify-content:center;align-items:center;gap:7px;cursor:pointer;box-shadow:3px 4px 0 var(--line);
  }
  .action svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;}
  .action-primary{background:var(--green);color:white;}
  .action-secondary{background:var(--amber);}
  .action:hover{transform:translateY(-1px);}
  .action.copied{background:var(--mint-deep);color:var(--ink);}
  .ledger{background:var(--ink);color:#eff8f0;border:2px solid var(--line);box-shadow:4px 5px 0 var(--green);padding:15px;min-width:0;overflow:hidden;}
  .ledger-title{display:flex;align-items:center;justify-content:space-between;font:900 17px/1 "Courier New",monospace;text-transform:uppercase;margin-bottom:11px;}
  .ledger-title span:last-child{color:#bfcbc1;font-size:16px;}
  .ledger-row{display:grid;grid-template-columns:58px 1fr auto;gap:8px;padding:8px 0;border-top:1px solid #344038;font:700 16px/1.45 "Courier New",monospace;}
  .ledger-row:first-of-type{border-top:0;}
  .ledger-state{color:#6dde91;}
  .about-note{font:700 16px/1.65 "Courier New",monospace;color:#35423a;padding:0 2px;}
  .about-note a{color:var(--ink);font-weight:900;text-underline-offset:3px;}
  .mobile-detail-close{display:none;}
  @media (max-width:1040px){
    .app-shell{grid-template-columns:200px minmax(420px,1fr) 360px;}
    .sidebar{padding-inline:11px;}
    .detail-pane{padding-inline:13px;}
    .detail-sheet{padding:16px;}
  }
  @media (max-width:860px){
    .app-shell{grid-template-columns:168px minmax(0,1fr);grid-template-rows:74px 1fr;}
    .sidebar{grid-row:1/-1;padding:16px 9px;}
    .brand{align-items:flex-start;}.brand-mark{width:30px;height:30px;}.brand-name{font-size:17px;}.brand-note{font-size:16px;}
    .rail-item{padding:9px 7px;font-size:16px;}.rail-item svg{width:14px;}.rail-count{font-size:16px;}
    .topbar{grid-column:2;padding-inline:13px;}.title-block{min-width:180px;}
    .catalog{grid-column:2;border-right:0;padding-inline:13px;}
    .detail-pane{position:fixed;grid-column:auto;grid-row:auto;z-index:50;inset:0;overflow:auto;transform:translateX(105%);transition:transform .28s cubic-bezier(.16,1,.3,1);background:var(--mint);padding:24px;}
    .detail-pane.open{transform:translateX(0);}
    .detail-sticky{position:static;max-width:560px;margin:0 auto;}
    .mobile-detail-close{display:flex;align-items:center;gap:7px;width:fit-content;border:2px solid var(--line);background:var(--paper);box-shadow:3px 3px 0 var(--line);padding:8px 10px;font-weight:900;font-size:16px;cursor:pointer;}
    .mobile-detail-close svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;}
  }
  @media (max-width:620px){
    .app-shell{display:block;}
    .sidebar,.topbar,.catalog{width:100%;max-width:100vw;min-width:0;}
    .sidebar{position:static;height:auto;border-right:0;border-bottom:2px solid var(--line);padding:12px;}
    .brand{margin-bottom:12px;}.brand-name{font-size:19px;}.rail-label,.rail-meta{display:none;}
    .rail-nav{display:flex;max-width:100%;overflow:auto;padding-bottom:5px;gap:8px;}
    .rail-item{width:auto;flex:0 0 auto;box-shadow:2px 3px 0 var(--line);}
    .topbar{position:relative;display:block;padding:14px 12px;}
    .title-block{min-width:0;}.search-wrap{width:100%;max-width:100%;margin:16px 0 0;}.random-btn{display:none;}
    h1{font-size:30px;}.catalog{padding:11px 11px 42px;border:0;}.filter-strip{top:0;max-width:100%;overflow:hidden;}
    .results-line span:last-child{display:none;}
    .detail-pane{inset:auto;top:0;right:auto;bottom:0;left:0;width:min(100vw,390px);max-width:390px;padding:14px 12px 32px;}.detail-sheet{padding:16px;}.detail-name{font-size:38px;}
    .card-main{grid-template-columns:1fr;}.repo-kind,.repo-url{text-align:left;}.repo-url{grid-row:auto;}.repo-name{font-size:24px;}
  }
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;}}
</style>
</head>

subtitleEl.textContent = `${REPOS.length} REPOS · ${CATEGORIES.length - 1} CATEGORIES`;
document.getElementById('nav-total').textContent = REPOS.length;

(function syncCountsFromData(){
  const total = REPOS.length;
  const titleText = `AI 與開發者開源專案導覽｜${total} 個 GitHub 精選連結`;
  const descText = `收錄 ${total} 個 GitHub 開源專案連結，涵蓋 AI 模型與框架、AI Agent 與自動化、聊天介面、開發工具、程式學習與面試準備、AI 記憶與 RAG、資安與 OSINT，可搜尋、可依分類篩選。`;

  document.title = titleText;
  document.querySelector('meta[name="description"]').setAttribute('content', descText);
  document.querySelector('meta[property="og:title"]').setAttribute('content', titleText);
  document.querySelector('meta[property="og:description"]').setAttribute('content', descText);
  document.querySelector('meta[name="twitter:title"]').setAttribute('content', titleText);
  document.querySelector('meta[name="twitter:description"]').setAttribute('content', descText);
})();

function renderChips(){
  chipsEl.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'chip' + (cat === activeCategory ? ' active' : '');
    const categoryCount = cat === 'All' ? REPOS.length : REPOS.filter(repo => repo.category === cat).length;
    el.textContent = `${CATEGORY_ZH[cat] || cat} ${String(categoryCount).padStart(2,'0')}`;
    el.setAttribute('aria-pressed', cat === activeCategory ? 'true' : 'false');
    el.addEventListener('click', () => {
      activeCategory = cat;
      syncRailState();
      renderChips();
      renderGrid();
    });
    chipsEl.appendChild(el);
  });
}

function matches(repo){
  const inCategory = activeCategory === 'All' || repo.category === activeCategory;
  if(!inCategory) return false;
  if(!query) return true;
  const q = query.toLowerCase();
  return repo.name.toLowerCase().includes(q)
    || repo.tagline.toLowerCase().includes(q)
    || (repo.tagline_zh||'').toLowerCase().includes(q)
    || repo.description.toLowerCase().includes(q)
    || (repo.description_zh||'').toLowerCase().includes(q)
    || repo.category.toLowerCase().includes(q)
    || repo.url.toLowerCase().includes(q);
}

function renderGrid(){
  const filtered = REPOS.filter(matches);
  countEl.textContent = `SHOWING ${String(filtered.length).padStart(2,'0')} / ${REPOS.length}`;
  gridEl.innerHTML = '';

  if(filtered.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = '<strong>找不到相符專案</strong><span>試試更短的關鍵字，或切換到「全部」。</span>';
    gridEl.appendChild(empty);
    return;
  }

  if(!filtered.some(repo => repo.id === selectedId)) selectedId = filtered[0].id;

  filtered.forEach(repo => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'repo-card' + (repo.id === selectedId ? ' selected' : '');
    card.setAttribute('aria-pressed', repo.id === selectedId ? 'true' : 'false');
    card.innerHTML = `
      <span class="repo-id">IDX-${String(repo.id).padStart(3,'0')}</span>
      <div class="card-main">
        <span class="repo-name">${escapeHtml(repo.name)}</span>
        <span class="repo-kind">${repo.org ? 'ORGANIZATION' : 'REPOSITORY'}</span>
        <span class="repo-tagline">${escapeHtml(repo.tagline_zh || repo.tagline)}</span>
        <span class="repo-url">${escapeHtml(repo.url)}</span>
      </div>
      <div class="card-foot">
        <span class="cat-tag">${escapeHtml(repo.category)}</span>
        ${repo.org ? '<span class="org-tag">組織首頁</span>' : ''}
        <span class="open-hint">INSPECT ${icon('arrow')}</span>
      </div>
    `;
    card.addEventListener('click', () => selectRepo(repo.id, true));
    gridEl.appendChild(card);
  });
  renderDetail();
}

function selectRepo(id, revealDetail){
  selectedId = id;
  renderGrid();
  if(revealDetail && window.innerWidth <= 860){
    lastDetailTrigger = document.querySelector('.repo-card[aria-pressed="true"]');
    openMobileDetail();
  }
}

function openMobileDetail(){
  if(detailPaneEl.parentElement !== document.body) document.body.appendChild(detailPaneEl);
  detailPaneEl.classList.add('open');
  detailPaneEl.inert = false;
  detailPaneEl.removeAttribute('aria-hidden');
  detailPaneEl.setAttribute('role','dialog');
  detailPaneEl.setAttribute('aria-modal','true');
  document.body.classList.add('detail-open');
  document.querySelectorAll('.sidebar,.topbar,.catalog').forEach(region => { region.inert = true; });
  document.getElementById('detail-close').focus();
}

function closeMobileDetail(){
  detailPaneEl.classList.remove('open');
  detailPaneEl.inert = true;
  detailPaneEl.setAttribute('aria-hidden','true');
  detailPaneEl.removeAttribute('role');
  detailPaneEl.removeAttribute('aria-modal');
  document.body.classList.remove('detail-open');
  document.querySelectorAll('.sidebar,.topbar,.catalog').forEach(region => { region.inert = false; });
  const target = lastDetailTrigger || document.querySelector('.repo-card[aria-pressed="true"]');
  if(target) target.focus();
}

function syncDetailMode(){
  if(window.innerWidth <= 860){
    if(detailPaneEl.classList.contains('open')) openMobileDetail();
    else {
      detailPaneEl.inert = true;
      detailPaneEl.setAttribute('aria-hidden','true');
    }
  }else{
    const shell = document.querySelector('.app-shell');
    if(detailPaneEl.parentElement !== shell) shell.appendChild(detailPaneEl);
    detailPaneEl.classList.remove('open');
    detailPaneEl.inert = false;
    detailPaneEl.removeAttribute('aria-hidden');
    detailPaneEl.removeAttribute('role');
    detailPaneEl.removeAttribute('aria-modal');
    document.body.classList.remove('detail-open');
    document.querySelectorAll('.sidebar,.topbar,.catalog').forEach(region => { region.inert = false; });
  }
}

function renderDetail(){
  const repo = REPOS.find(item => item.id === selectedId) || REPOS[0];
  const fullUrl = 'https://' + repo.url;
  detailSheetEl.innerHTML = `
    <div class="detail-head">
      <div class="detail-name">${escapeHtml(repo.name)}</div>
      <div class="detail-number">RECORD<br>#${String(repo.id).padStart(3,'0')}</div>
    </div>
    <div class="detail-meta">
      <div><div class="meta-label">Category</div><div class="meta-value">${escapeHtml(CATEGORY_ZH[repo.category] || repo.category)}</div></div>
      <div><div class="meta-label">Source type</div><div class="meta-value">${repo.org ? 'GitHub 組織首頁' : 'GitHub Repository'}</div></div>
      <div><div class="meta-label">Handle</div><div class="meta-value">${escapeHtml(repo.url.replace('github.com/',''))}</div></div>
      <div><div class="meta-label">Index status</div><div class="meta-value">VERIFIED LINK</div></div>
    </div>
    <div class="detail-copy">
      <h2>PROJECT BRIEF</h2>
      <p>${escapeHtml(repo.description_zh || repo.description)}</p>
      <p class="english">${escapeHtml(repo.description)}</p>
    </div>
    <div class="detail-actions">
      <a class="action action-primary" href="${escapeHtml(fullUrl)}" target="_blank" rel="noopener noreferrer">${icon('external')}開啟 GitHub</a>
      <button class="action action-secondary" id="copy-detail" type="button">${icon('copy')}複製連結</button>
    </div>
  `;
  document.getElementById('copy-detail').addEventListener('click', copySelectedLink);
}

async function copySelectedLink(){
  const repo = REPOS.find(item => item.id === selectedId);
  const url = 'https://' + repo.url;
  const button = document.getElementById('copy-detail');
  try{
    await navigator.clipboard.writeText(url);
    button.classList.add('copied');
    button.innerHTML = `${icon('check')}已複製`;
    setTimeout(() => {
      button.classList.remove('copied');
      button.innerHTML = `${icon('copy')}複製連結`;
    }, 1400);
  }catch(error){
    window.prompt('請複製此連結：', url);
  }
}

function icon(name){
  const paths = {
    arrow:'<path d="M5 12h13M13 6l6 6-6 6"/>',
    external:'<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 13v6H5V6h6"/>',
    copy:'<rect x="8" y="8" width="11" height="11"/><path d="M16 8V5H5v11h3"/>',
    check:'<path d="m5 12 4 4L19 6"/>'
  };
  return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`;
}

function syncRailState(){
  document.querySelectorAll('[data-rail]').forEach(button => {
    const value = button.dataset.rail;
    button.classList.toggle('active', (value === 'all' && activeCategory === 'All') || value === activeCategory);
  });
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

searchEl.addEventListener('input', (e) => {
  query = e.target.value.trim();
  renderGrid();
});

document.addEventListener('keydown', event => {
  if(event.key === '/' && document.activeElement !== searchEl){
    event.preventDefault();
    searchEl.focus();
  }
  if(event.key === 'Escape' && detailPaneEl.classList.contains('open')){
    closeMobileDetail();
  }
  if(event.key === 'Tab' && detailPaneEl.classList.contains('open')){
    const focusable = [...detailPaneEl.querySelectorAll('button:not([disabled]),a[href]')];
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if(event.shiftKey && document.activeElement === first){
      event.preventDefault();
      last.focus();
    }else if(!event.shiftKey && document.activeElement === last){
      event.preventDefault();
      first.focus();
    }
  }
});

document.querySelectorAll('[data-rail]').forEach(button => {
  button.addEventListener('click', () => {
    activeCategory = button.dataset.rail === 'all' ? 'All' : button.dataset.rail;
    renderChips();
    renderGrid();
    syncRailState();
  });
});

document.getElementById('random-btn').addEventListener('click', () => {
  const pool = REPOS.filter(matches);
  if(!pool.length) return;
  const next = pool[Math.floor(Math.random() * pool.length)];
  selectRepo(next.id, true);
  const card = document.querySelector(`.repo-card[aria-pressed="true"]`);
  if(card) card.scrollIntoView({behavior:'smooth',block:'center'});
});

document.getElementById('detail-close').addEventListener('click', () => {
  closeMobileDetail();
});

renderChips();
renderGrid();
syncDetailMode();
if(requestedId && window.innerWidth <= 860){
  lastDetailTrigger = document.querySelector('.repo-card[aria-pressed="true"]');
  openMobileDetail();
}
window.addEventListener('resize', syncDetailMode);
</script>

</body>
</html>
